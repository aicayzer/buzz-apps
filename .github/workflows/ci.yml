name: Checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: node scripts/package-release.mjs
      - run: docker build -t buzz-apps:check .
        if: matrix.node == 24
